name: Bootstrap SDCS Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract SDCS
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xz_* > /tmp/sdcs_release.b64
          base64 -d /tmp/sdcs_release.b64 > /tmp/sdcs_release.tar.xz
          tar -xJf /tmp/sdcs_release.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-release.yml

      - name: Commit frozen release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: SDCS Story OS 1.0.0"
          git push origin HEAD:main
