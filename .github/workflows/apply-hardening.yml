name: Apply SDCS 1.0.1 Hardening

on:
  push:
    branches:
      - sdcs-1.0.1-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'harden SDCS runtime to 1.0.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdcs-1.0.1-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .hardening/chunk_* > /tmp/sdcs101.b64
          base64 -d /tmp/sdcs101.b64 > /tmp/sdcs101.tar.xz
          tar -xJf /tmp/sdcs101.tar.xz -C .
          rm -rf .hardening
          rm -f PUBLISH_TO_GITHUB.md
          rm -f .github/workflows/apply-hardening.yml

      - name: Run release hardening tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python tools/selftest.py
          python tools/contract_tests.py
          python tools/validate_project.py examples/minimal-project

      - name: Commit hardened release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hieuphamdeptrai"
          git config user.email "71170655+hieuphamdeptrai@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: harden SDCS runtime to 1.0.1"
          git push origin HEAD:sdcs-1.0.1-hardening
